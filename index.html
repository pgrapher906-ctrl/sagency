<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S Agency - Adfactors PR</title>
  <link href="./style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .parallax {
      background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80');
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
    }
    .fade-transition { transition: opacity 0.5s ease-in-out; }
  </style>
</head>
<body class="bg-[#f8f9fa] text-brand-dark">

  <header class="bg-white sticky top-0 z-50 shadow-sm border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer">
          <img src="logo-s.png" alt="Logo" class="h-10 w-10 rounded-md">
          <span class="font-bold text-xl text-brand-dark">S Agency</span>
        </div>

        <nav class="hidden md:flex space-x-8 items-center h-full text-sm font-medium">
          <a href="#" class="hover:text-brand-orange transition-colors">About Us</a>
          <a href="#" class="hover:text-brand-orange transition-colors">Expertise</a>
          <a href="#" class="hover:text-brand-orange transition-colors">Sectors</a>
          <a href="contact.html" class="px-6 py-2.5 bg-brand-orange text-white rounded-full font-bold hover:scale-105 transform transition-all">Write to Us</a>
        </nav>

        <div class="md:hidden">
          <button id="mobile-menu-btn" class="p-2 focus:outline-none">
            <svg class="h-7 w-7 text-brand-dark" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100 shadow-lg p-4 space-y-2">
      <a href="#" class="block p-3 hover:bg-orange-50 rounded-md">About Us</a>
      <a href="#" class="block p-3 hover:bg-orange-50 rounded-md">Expertise</a>
      <a href="contact.html" class="block p-3 bg-brand-orange text-white text-center rounded-md font-bold">Write to Us</a>
    </div>
  </header>

  <section class="bg-gradient-to-r from-brand-orange to-[#de6b11] text-white py-12 md:py-20 px-4">
    <div id="carousel-container" class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between fade-transition">
      <div class="w-full md:w-3/4 text-center md:text-left">
        <h1 id="carousel-quote" class="text-3xl md:text-5xl font-bold mb-4 leading-tight">“Reputation management is who we are.”</h1>
        <p id="carousel-subtext" class="text-lg md:text-xl opacity-90">Building trust in a complex world.</p>
      </div>
      <img id="carousel-image" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=facearea&w=256&h=256" class="w-32 h-32 md:w-48 md:h-48 rounded-full border-4 border-white shadow-2xl mt-8 md:mt-0 object-cover">
    </div>
  </section>

  <section class="py-16 px-4">
    <div class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
      <div class="bg-brand-dark p-6 rounded-xl text-white text-center shadow-md">
        <span class="block font-bold text-sm">Best PR Agency</span>
      </div>
      <div class="bg-brand-dark p-6 rounded-xl text-white text-center shadow-md">
        <span class="block font-bold text-sm">SABRE Winner</span>
      </div>
      <div class="bg-brand-dark p-6 rounded-xl text-white text-center shadow-md">
        <span class="block font-bold text-sm">PRWeek Asia</span>
      </div>
      <div class="bg-brand-dark p-6 rounded-xl text-white text-center shadow-md">
        <span class="block font-bold text-sm">India PR Awards</span>
      </div>
    </div>
  </section>

  <footer class="bg-brand-dark text-white py-10 text-center border-t border-gray-700">
    <p class="text-sm opacity-50">© 2026 S Agency. All rights reserved.</p>
  </footer>

  <script>
    // Mobile Menu Logic
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    btn.onclick = () => menu.classList.toggle('hidden');

    // Auto Carousel Logic
    const testimonials = [
      { q: "“Reputation management is who we are.”", s: "S Agency Leadership", i: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=facearea&w=256&h=256" },
      { q: "“Strategic communication at its best.”", s: "Adfactors Advisory", i: "https://images.unsplash.com/photo-1557862921-37829c790f19?auto=format&fit=crop&w=256&h=256" }
    ];
    let idx = 0;
    setInterval(() => {
      const c = document.getElementById('carousel-container');
      c.classList.add('opacity-0');
      setTimeout(() => {
        idx = (idx + 1) % testimonials.length;
        document.getElementById('carousel-quote').innerText = testimonials[idx].q;
        document.getElementById('carousel-subtext').innerText = testimonials[idx].s;
        document.getElementById('carousel-image').src = testimonials[idx].i;
        c.classList.remove('opacity-0');
      }, 500);
    }, 5000);
  </script>
</body>
</html>
