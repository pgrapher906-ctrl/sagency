<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Adfactors PR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-orange': '#ed8a19',
            'brand-dark': '#2a3b4c'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#f8f9fa] text-brand-dark min-h-screen flex flex-col">

  <header class="flex items-center justify-between px-6 md:px-8 py-6 bg-white shadow-sm border-b border-gray-100">
    <a href="index.html" class="text-brand-orange font-bold text-sm hover:underline flex items-center gap-2">&larr; Back to Home</a>
    <span class="font-bold text-xl md:text-2xl tracking-tight text-brand-dark">Contact Us</span>
    <div class="w-10"></div>
  </header>

  <main class="flex-grow flex flex-col md:flex-row max-w-5xl mx-auto w-full bg-white rounded-xl shadow-md mt-8 md:mt-12 mb-16 overflow-hidden border border-gray-100">
    
    <section class="w-full md:w-1/2 p-8 md:p-10 border-b md:border-b-0 md:border-r border-gray-50">
      <h2 class="text-2xl md:text-3xl font-bold mb-8 text-brand-orange">Write to Us</h2>
      
      <form id="contactForm" class="space-y-5">
        <div class="flex flex-col sm:flex-row space-y-5 sm:space-y-0 sm:space-x-4">
          <input type="text" name="firstName" placeholder="First Name" required class="flex-1 px-4 py-3 border border-gray-200 rounded-md outline-none focus:ring-1 focus:ring-brand-orange text-sm md:text-base">
          <input type="text" name="lastName" placeholder="Last Name" required class="flex-1 px-4 py-3 border border-gray-100 rounded-md outline-none focus:ring-1 focus:ring-brand-orange text-sm md:text-base">
        </div>
        
        <input type="email" name="email" placeholder="Email" required class="w-full px-4 py-3 border border-gray-200 rounded-md outline-none focus:ring-1 focus:ring-brand-orange text-sm md:text-base">
        
        <input type="tel" name="contactNumber" placeholder="Contact Number" required class="w-full px-4 py-3 border border-gray-200 rounded-md outline-none focus:ring-1 focus:ring-brand-orange text-sm md:text-base">
        
        <input type="text" name="companyName" placeholder="Company Name" class="w-full px-4 py-3 border border-gray-200 rounded-md outline-none focus:ring-1 focus:ring-brand-orange text-sm md:text-base">
        
        <textarea name="message" placeholder="Your Message" required rows="4" class="w-full px-4 py-3 border border-gray-200 rounded-md outline-none focus:ring-1 focus:ring-brand-orange resize-none text-sm md:text-base"></textarea>
        
        <button type="submit" class="w-full py-3.5 bg-brand-orange text-white font-bold rounded-md hover:bg-[#de6b11] transition-colors shadow-sm text-lg">Send Message</button>
      </form>
      
      <div id="formResponse" class="mt-4 font-bold text-sm"></div>
    </section>

    <section class="w-full md:w-1/2 bg-[#f8f9fa] p-8 md:p-10 flex flex-col justify-center">
      <h3 class="text-xl md:text-2xl font-bold mb-8 text-brand-dark">Contact Details</h3>
      <div class="space-y-8 text-gray-600 text-sm md:text-base">
        <div><h4 class="font-bold text-brand-orange text-lg">Career Inquiries</h4><p>careers@adfactorspr.com</p></div>
        <div><h4 class="font-bold text-brand-orange text-lg">Business Inquiries</h4><p>business@adfactorspr.com</p></div>
        <div><h4 class="font-bold text-brand-orange text-lg">General Inquiries</h4><p>info@adfactorspr.com</p></div>
      </div>
    </section>
  </main>

  <footer class="text-center text-xs md:text-sm text-gray-500 py-6 mt-auto">© 2026 Adfactors PR. All rights reserved.</footer>

  <script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const responseDiv = document.getElementById('formResponse');
      
      const data = {
        firstName: document.getElementsByName('firstName')[0].value,
        lastName: document.getElementsByName('lastName')[0].value,
        email: document.getElementsByName('email')[0].value,
        contactNumber: document.getElementsByName('contactNumber')[0].value,
        companyName: document.getElementsByName('companyName')[0].value,
        message: document.getElementsByName('message')[0].value
      };

      responseDiv.textContent = 'Sending...';
      responseDiv.className = 'mt-4 font-bold text-sm text-gray-500';

      try {
        const res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok && result.success) {
          responseDiv.textContent = 'Success';
          responseDiv.className = 'mt-4 font-bold text-green-600';
          document.getElementById('contactForm').reset();
        } else {
          responseDiv.textContent = '';
        }
      } catch (err) {
        responseDiv.textContent = '';
      }
    });
  </script>
</body>
</html>
